<text x="20" y="31.5" font-size="16" font-weight="600" fill="#3b4148" text-anchor="start">ANALYZE: from both cameras to u, v and w</text>
<text x="546" y="30" font-size="9.5" fill="#a3a9b0" text-anchor="end">pivlab.de · CC BY 4.0</text>
<text x="20" y="294" font-size="12" fill="#7b828a" text-anchor="start">ANALYZE runs a 2D PIV analysis of each camera (same settings, corrected images). The two fields</text><text x="20" y="310" font-size="12" fill="#7b828a" text-anchor="start">differ because each camera sees the out-of-plane motion from its own side; PIVlab combines them</text><text x="20" y="326" font-size="12" fill="#7b828a" text-anchor="start">automatically into one 3D vector per point: u, v in the board plane, w along Z.</text>
</svg>
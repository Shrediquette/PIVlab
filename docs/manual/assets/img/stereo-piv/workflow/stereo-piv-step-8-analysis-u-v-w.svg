<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Stereo-PIV: ANALYZE: from both cameras to u, v and w</title>
<desc>ANALYZE runs a 2D PIV analysis of each camera (same settings, corrected images). The two fields differ because each camera sees the out-of-plane motion from its own side; PIVlab combines them automatically into one 3D vector per point: u, v in the board plane, w along Z. Drawing: PIVlab, www.pivlab.de, CC BY 4.0.</desc>

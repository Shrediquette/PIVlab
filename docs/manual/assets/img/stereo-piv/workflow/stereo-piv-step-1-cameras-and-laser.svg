<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Stereo-PIV: Set up cameras and laser</title>
<desc>Any direction between the cameras works (30–90°). Cameras downstream of the laser see the bright forward scatter. A Scheimpflug adapter on each camera keeps the oblique view sharp everywhere. Drawing: PIVlab, www.pivlab.de, CC BY 4.0.</desc>
<defs><marker id="a-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3b4148"/></marker><marker id="a-mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7b828a"/></marker><marker id="a-cam1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#338cff"/></marker><marker id="a-cam2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ff8c1a"/></marker><marker id="a-laser" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#22a84a"/></marker></defs>
<rect x="0.5" y="0.5" width="559" height="339" rx="10" fill="#fafbfc" stroke="#c9ced5"/>
<line x1="280" y1="50" x2="280" y2="270" stroke="#c9ced5" stroke-width="1" stroke-linecap="round"/><text x="26" y="64" font-size="12" font-weight="600" fill="#3b4148" text-anchor="start">a) same side (top view)</text><g transform="translate(48,104) rotate(0)"><rect x="-34" y="-7" width="30" height="14" rx="2" fill="#22a84a" fill-opacity="0.25" stroke="#22a84a" stroke-width="1.4"/><path d="M-4,-4 L4,-7 L4,7 L-4,4 z" fill="#22a84a" fill-opacity="0.5" stroke="#22a84a" stroke-width="1"/></g><line x1="48" y1="104" x2="262" y2="104" stroke="#22a84a" stroke-width="2" stroke-linecap="round"/><line x1="150" y1="90" x2="196" y2="90" stroke="#22a84a" stroke-width="1.2" marker-end="url(#a-laser)" stroke-linecap="round"/><line x1="100.6" y1="202.6" x2="158" y2="104" stroke="#338cff" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><line x1="215.4" y1="202.6" x2="158" y2="104" stroke="#ff8c1a" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><g transform="translate(94,214) rotate(30.2) scale(1.1)"><rect x="-15" y="0" width="30" height="22" rx="3" fill="#338cff" fill-opacity="0.22" stroke="#338cff" stroke-width="1.2727272727272725"/><rect x="-8" y="-12" width="16" height="12" rx="1.5" fill="#ffffff" stroke="#338cff" stroke-width="1.2727272727272725"/></g><g transform="translate(222,214) rotate(-30.2) scale(1.1)"><rect x="-15" y="0" width="30" height="22" rx="3" fill="#ff8c1a" fill-opacity="0.22" stroke="#ff8c1a" stroke-width="1.2727272727272725"/><rect x="-8" y="-12" width="16" height="12" rx="1.5" fill="#ffffff" stroke="#ff8c1a" stroke-width="1.2727272727272725"/></g><text x="94" y="254" font-size="10.5" fill="#7b828a" text-anchor="middle">backward scatter</text><text x="94" y="266" font-size="10.5" fill="#7b828a" text-anchor="middle">(darker)</text><text x="222" y="254" font-size="10.5" fill="#7b828a" text-anchor="middle">forward scatter</text><text x="222" y="266" font-size="10.5" fill="#7b828a" text-anchor="middle">(brighter)</text><text x="158" y="160" font-size="11.5" font-weight="600" fill="#3b4148" text-anchor="middle">30–90°</text><text x="296" y="64" font-size="12" font-weight="600" fill="#3b4148" text-anchor="start">b) opposite sides, downstream (top view)</text><g transform="translate(320,160) rotate(0)"><rect x="-34" y="-7" width="30" height="14" rx="2" fill="#22a84a" fill-opacity="0.25" stroke="#22a84a" stroke-width="1.4"/><path d="M-4,-4 L4,-7 L4,7 L-4,4 z" fill="#22a84a" fill-opacity="0.5" stroke="#22a84a" stroke-width="1"/></g><line x1="320" y1="160" x2="540" y2="160" stroke="#22a84a" stroke-width="2" stroke-linecap="round"/><line x1="344" y1="174" x2="390" y2="174" stroke="#22a84a" stroke-width="1.2" marker-end="url(#a-laser)" stroke-linecap="round"/><line x1="447.7" y1="215.7" x2="392" y2="160" stroke="#338cff" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><line x1="447.7" y1="104.3" x2="392" y2="160" stroke="#ff8c1a" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><g transform="translate(457.1,225.1) rotate(-45) scale(1.1)"><rect x="-15" y="0" width="30" height="22" rx="3" fill="#338cff" fill-opacity="0.22" stroke="#338cff" stroke-width="1.2727272727272725"/><rect x="-8" y="-12" width="16" height="12" rx="1.5" fill="#ffffff" stroke="#338cff" stroke-width="1.2727272727272725"/></g><g transform="translate(457.1,94.9) rotate(-135) scale(1.1)"><rect x="-15" y="0" width="30" height="22" rx="3" fill="#ff8c1a" fill-opacity="0.22" stroke="#ff8c1a" stroke-width="1.2727272727272725"/><rect x="-8" y="-12" width="16" height="12" rx="1.5" fill="#ffffff" stroke="#ff8c1a" stroke-width="1.2727272727272725"/></g><text x="481.1" y="247.1" font-size="10.5" fill="#7b828a" text-anchor="start">forward</text><text x="481.1" y="82.9" font-size="10.5" fill="#7b828a" text-anchor="start">forward</text><text x="386" y="152" font-size="10.5" fill="#22a84a" text-anchor="end">sheet</text>


[[package]]
use-license-bsd = false
name = ""
version = "3.13"
description = "PIVlab is a free and open-source particle image velocimetry (PIV) software and is currently the most frequently cited PIV tool on the market. It can be used to calculate the velocity distribution within imported (or captured) images. It can also control OPTOLUTION’s lasers, cameras and synchronizers, and derive, display and export multiple parameters of the flow pattern. The simple graphical user interface makes PIV data acquisition and data post-processing fast and efficient."
id = "f7c33dd1-18cd-4708-a025-7ce388954b13"
package-root = "./"
provider.name = "William Thielicke"
provider.email = "Thielicke@optolution.com"
provider.organization = "OPTOLUTION Messtechnik GmbH"
display-name = "PIVlab"
summary = "Easy to use, GUI based tool to capture, analyze, validate, postprocess, visualize and simulate PIV data. http://PIVlab.de"
output-file-name = "PIVlab.mltbx"
output-folder = "Toolbox"
release-compatibility = "19.2.* - 25.2.*"
preview-image-file = "images/pivlab_logo1.png"
getting-started-file = "doc/GettingStarted.mlx"
supported-platforms = [
    "windows",
    "linux",
    "macos",
]

# MATLAB path of the installed toolbox (without this table, MATLAB guesses the folders, e.g. JORS_paper, Example_data)
